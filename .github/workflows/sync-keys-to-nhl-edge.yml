name: sync-keys-to-nhl-edge
on:
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror secrets to nhl-edge
        env:
          GH_TOKEN: ${{ secrets.SYNC_GH_TOKEN }}
          BDL: ${{ secrets.BALLDONTLIE_API_KEY }}
          ODDS: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -e
          echo -n "$BDL" | gh secret set BALLDONTLIE_API_KEY -R jacobtulster/nhl-edge
          echo -n "$ODDS" | gh secret set ODDS_API_KEY -R jacobtulster/nhl-edge
          echo "mirrored"
