<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NBA Edge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg"></div>
    <main>
      <header>
        <p class="brand">NBA Edge</p>
        <h1>Today’s value board</h1>
        <p class="lede">
          Model probabilities vs book prices. Positive EV means the model likes
          the price more than the market.
        </p>
        <p id="meta" class="meta">Loading…</p>
      </header>

      <section aria-label="EV board">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Matchup</th>
                <th>Model home</th>
                <th>Best home odds</th>
                <th>Home EV</th>
                <th>Best away odds</th>
                <th>Away EV</th>
                <th>Top side</th>
              </tr>
            </thead>
            <tbody id="rows">
              <tr>
                <td colspan="7">Loading board…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <footer>
        <p id="footnote"></p>
      </footer>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
